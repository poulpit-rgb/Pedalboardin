name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/PedalierBancDEssai_artefacts/Release/*.exe" dist/Pedalier-Banc-d-essai.exe
          Compress-Archive -Path dist/Pedalier-Banc-d-essai.exe -DestinationPath dist/Pedalier-Banc-d-essai-Windows.zip

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Pedalier-Banc-d-essai-Windows
          path: dist/Pedalier-Banc-d-essai.exe

      # Every push to main refreshes the "latest" release, so the newest .exe
      # is always at .../releases/latest/download/Pedalier-Banc-d-essai.exe
      - name: Publish latest release
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Pedalier-Banc-d-essai-Windows.zip dist/Pedalier-Banc-d-essai.exe \
            --title "Dernière version (${GITHUB_SHA::7})" \
            --notes "Version compilée automatiquement depuis la branche main. Télécharge **Pedalier-Banc-d-essai-Windows.zip** ci-dessous, décompresse-le et lance le .exe." \
            --target "$GITHUB_SHA" --latest
